evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
    - "diff"
    - "full"
  patch_type_probs:
    - 0.7
    - 0.3
  num_generations: 3  # Very small for quick testing
  max_parallel_jobs: 1
  max_patch_attempts: 5
  llm_models:
    - "gpt-5-mini"  # Fast and cheap model for testing
  llm_dynamic_selection: null
  embedding_model: "text-embedding-3-small"
  results_dir: ${output_dir}