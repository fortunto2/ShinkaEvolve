evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
    - "diff"
    - "full"
    - "cross"
  patch_type_probs:
    - 0.5
    - 0.4
    - 0.1
  num_generations: 20
  max_parallel_jobs: 1
  max_patch_attempts: 10
  llm_models:
    - "gpt-5-mini"
  llm_dynamic_selection: null
  embedding_model: "text-embedding-3-small"
  results_dir: ${output_dir}
  # SGR specific parameters
  use_sgr: true
  sgr_confidence_threshold: 0.7
  sgr_fallback_to_random: true