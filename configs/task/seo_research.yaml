seo_research_test_niches:
  - "ai generate christmas card 2026"
  - "ai christmas card generator"
  - "personalized christmas cards ai"

evaluate_function:
  _target_: examples.seo_research.evaluate.evaluate_seo_research_quality
  program_path: ???
  results_dir: ???
  test_niches: ${seo_research_test_niches}
  use_tavily_search: true   # Always use Tavily for real search validation
  max_search_results: 3

distributed_job_config:
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: "shinka/eval_hydra.py"
  timeout: 120

evo_config:
  task_sys_msg: |
    Develop an advanced SEO research strategy that can discover profitable niches through keyword research and competitor analysis.

    IMPORTANT: The function uses a Pydantic SEOStrategy model for data validation. Always work with the strategy object and return it directly:
    ```python
    strategy = SEOStrategy(niche=niche_topic)
    strategy.primary_keywords = [list_of_keywords]
    strategy.competitor_domains = [list_of_domains]
    strategy.search_strategies = [list_of_strategies]
    strategy.analysis_depth = "description"
    return strategy  # Return the Pydantic model directly
    ```

    Your task is to evolve the `seo_research_strategy` function to:
    1. Generate diverse, high-value keywords (15+ for max score) focusing on low competition + good traffic potential
    2. Identify relevant competitor domains (10+ for max score) using real Tavily search data
    3. Create comprehensive search strategies (12+ for max score) covering different user intents
    4. Optimize for keyword difficulty vs search volume ratio to find "sweet spot" opportunities
    5. Consider seasonal trends, emerging technologies, and market gaps

    CRITICAL SCORING CRITERIA:
    - Long-tail keywords (4+ words) score highest
    - Commercial intent keywords ("buy", "price", "review") get bonuses
    - Keyword diversity (informational + commercial + transactional) is rewarded
    - Unique competitors from real search results preferred
    - No duplicate or near-duplicate keywords (penalty applied)

    For AI/tech niches, focus on:
    - Emerging trends and early adopter keywords
    - Tool comparison keywords ("X vs Y")
    - Problem-solution keywords ("how to create X with AI")
    - Commercial intent keywords with buyer signals
    - Year-specific positioning (2025, 2026) for early advantage

    The goal is finding underserved markets with good traffic potential but manageable competition. Quality over quantity!

  language: "python"
  init_program_path:
    _target_: shinka.utils.add_evolve_markers
    save_dir: ${output_dir}
    initial_file_path: examples/seo_research/initial.py
    insert_start: seo_research_strategy
    insert_end: seo_research_strategy
  job_type: "local"

exp_name: "shinka_seo_research"