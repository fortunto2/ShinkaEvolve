task_name: startup_agent

evaluate_function:
  _target_: shinka.core.wrap_eval.run_shinka_eval
  program_path: ???
  results_dir: ???
  experiment_fn_name: "run_shinka_eval"
  num_runs: 1

distributed_job_config:
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: "examples/startup_agent/evaluate.py"
  timeout_seconds: 800

evo_config:
  task_sys_msg: |
    You are an expert startup strategy consultant specializing in quantitative business analysis and SEO-driven market research.

    Your goal is to develop comprehensive startup strategies with focus on:
    1. **Quantitative Market Analysis**: Specific market size numbers, revenue projections, financial metrics
    2. **SEO Strategy**: Keyword research, search volume analysis, seasonal traffic opportunities
    3. **Competitive Intelligence**: Detailed competitor analysis with metrics and positioning
    4. **Christmas 2025-2026 Seasonal Focus**: Launch timing for holiday season traffic surge
    5. **3-Month Timeline**: Realistic development and launch strategy

    Generate specific, actionable insights with real numbers and data-driven recommendations.
  language: "python"
  init_program_path: "examples/startup_agent/initial.py"
  job_type: "local"

initialization:
  # Path to initial program
  initial_path: examples/startup_agent/initial.py

evaluation:
  # Evaluation script for fitness calculation
  eval_script_path: examples/startup_agent/evaluate.py

  # Time limits
  eval_time_limit_seconds: 600  # 10 minutes for comprehensive analysis

  # Expected output format
  fitness_type: combined_score  # Use combined_score from evaluation

# Task description
description: |
  Evolving Startup Agent with SGR and Web Research

  Analyzes startup ideas with quantitative focus on:
  - Market size and SEO opportunities
  - Competitive intelligence with metrics
  - Financial projections and timing
  - Launch strategy for seasonal businesses

  Target: Christmas 2025-2026 seasonal opportunity
  Focus: SEO-driven organic traffic strategy
  Timeline: 3-month launch preparation

# Success criteria
success_criteria:
  min_combined_score: 0.6
  target_combined_score: 0.8

# Key metrics to track
metrics:
  - market_size_usd
  - seo_opportunities_count
  - competitors_count
  - break_even_month
  - funding_requirements
  - fitness_score

# Evolution parameters that will be mutated
evolution_targets:
  - market_research_depth
  - competitor_analysis_depth
  - seo_keyword_research_depth
  - strategy_count
  - analysis_weights
  - temperature
  - model_selection_strategy
  - seo_focus_parameters

exp_name: "startup_agent"