defaults:
  - override /database@_global_: island_small
  - override /evolution@_global_: sgr_small_budget
  - override /task@_global_: startup_agent
  - override /cluster@_global_: local
  - _self_

variant_suffix: "_quick"

# Override evolution config for quick testing
evolution:
  # Use SGR but with quick settings
  use_sgr: true
  sgr_confidence_threshold: 0.7
  sgr_fallback_to_random: false

  # Single generation for quick testing
  num_generations: 1

  # Model configuration
  model_names: ["gpt-5-mini"]
  model_selection: bandit

# Database configuration for startup evolution
database:
  # Use smaller islands for faster iteration
  num_islands: 2
  island_size: 8
  archive_size: 12

  # Selection strategy optimized for quantitative analysis
  selection_strategy: adaptive_parent_sampling
  selection_temperature: 0.8

# Task-specific overrides
task:
  # Short time limit for quick testing
  eval_time_limit_seconds: 300  # 5 minutes for quick test

  # Lower success criteria for testing
  success_criteria:
    min_combined_score: 0.5
    target_combined_score: 0.7

# Logging and output
logging:
  level: INFO
  save_evolution_progress: true
  save_generation_snapshots: true